name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore NMSLegacyVersionInstaller.sln

      - name: Build (Release|x86)
        run: msbuild NMSLegacyVersionInstaller.sln /p:Configuration=Release /p:Platform=x86 /m

      - name: Locate build output
        id: locate
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -Filter "NMSLegacyVersionInstaller.exe" `
            | Where-Object { $_.FullName -match "\\bin\\x86\\Release\\" } `
            | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path . -Recurse -Filter "NMSLegacyVersionInstaller.exe" `
              | Where-Object { $_.FullName -match "\\Release\\" } `
              | Select-Object -First 1
          }
          if (-not $exe) { throw "Build output NMSLegacyVersionInstaller.exe not found" }
          echo "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NMSLegacyVersionInstaller
          path: ${{ steps.locate.outputs.exe_path }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.exe_path }}
          generate_release_notes: true
