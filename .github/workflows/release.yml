name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # Publishes the single self-contained executable into bin\ and runs the self-check,
      # which is everything the install does apart from the Steam download.
      - name: Build
        shell: pwsh
        run: .\Build.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NMSRetroInstaller
          path: bin/NMSRetroInstaller.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/NMSRetroInstaller.exe
          generate_release_notes: true
